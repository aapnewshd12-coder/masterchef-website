<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Chef AI - Smart Recipe Generator</title>
    <style>
        /* Body: Dark Black Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #121212; /* Gehra Kala */
            color: #e0e0e0; /* Light Gray Text */
            padding: 80px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container: Slightly Lighter Dark Gray */
        .container {
            max-width: 650px;
            background: #1e1e1e; /* Thora sa light kala */
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5); /* Shadow for depth */
            border: 1px solid #333;
        }

        /* Heading: Elegant Golden Color */
        h1 {
            color: #d4af37; /* Sunehri (Golden) */
            font-size: 42px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Paragraph Text */
        p {
            color: #b0b0b0; /* Medium Gray Text */
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Button: Golden Background with Dark Text */
        .btn {
            display: inline-block;
            background-color: #d4af37; /* Sunehri (Golden) */
            color: #121212; /* Kala Text */
            padding: 18px 40px;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px; /* Fully rounded button */
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0px 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* Button Hover Effect */
        .btn:hover {
            background-color: #e6c250; /* Thora zyada chamakdar golden */
            transform: translateY(-3px); /* Upar uthta hua effect */
            box-shadow: 0px 6px 20px rgba(212, 175, 55, 0.5);
        }

        /* Responsive Mobile Design */
        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 32px;
            }
            p {
                font-size: 18px;
            }
            .btn {
                font-size: 18px;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Master Chef AI 🍳</h1>
        <p>Apne ghar ke bache hue ingredients se duniya ki sab se behtareen recipes tayaar karein sirf aik click par! Apne AI Chef se baat karein aur naye pakwan banayein.</p>
        
        <!-- Golden Button with your Streamlit Link -->
        <a href="https://master-chef-ai-kbrf3jygrejs8pwqp2fe6s.streamlit.app/" target="_blank" class="btn">Launch Master Chef AI</a>
    </div>

</body>
</html>
